name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run lint
      - run: npm run build
    env:
      # No postgres service is defined in this job -- nothing ever connects
      # to this URL; it exists only so prisma generate sees DATABASE_URL set.
      # Deliberately not a real credential, isolated from every real database.
      DATABASE_URL: postgresql://ci_placeholder_user:ci_placeholder_password@localhost:5432/ci_placeholder_db?schema=public

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run lint
      - run: npm run build
